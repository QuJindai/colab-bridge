[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-bridge-agent"
version = "0.2.0"
description = "Google Colab runtime telemetry and GPU job worker for Colab Bridge"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
license = { text = "MIT" }

[project.optional-dependencies]
models = ["transformers==4.57.6", "peft==0.18.1", "accelerate==1.15.0", "huggingface-hub==0.36.2", "safetensors==0.8.0", "sentencepiece==0.2.1"]
modelscope = ["modelscope==1.40.0", "modelscope-hub==0.4.2"]
onnx = ["onnx==1.22.0", "onnxscript==0.7.2"]
drive = ["google-api-python-client==2.200.0", "google-auth==2.58.0"]

[tool.setuptools]
package-dir = {"" = "agent"}

[tool.setuptools.packages.find]
where = ["agent"]
include = ["colab_bridge_agent*"]

[tool.pytest.ini_options]
pythonpath = ["agent"]
testpaths = ["agent/tests"]
